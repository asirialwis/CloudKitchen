name: Dependency & Image Security

on:
  push:
  pull_request:

env:
  NODE_VERSION: "20.11.1-alpine"
  MIN_AUDIT_LEVEL: "high" # fail build if >= this severity is found (low|moderate|high|critical)

jobs:
  npm-audit:
    name: NPM Audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - delivery-service
          - notification-service
          - order-service
          - payment-service
          - restaurant-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json

      - name: Install (prod-only)
        run: npm ci --omit=dev

      - name: npm audit (prod deps)
        # Will fail if >= MIN_AUDIT_LEVEL vulnerabilities exist
        run: npm audit --omit=dev --audit-level=${{ env.MIN_AUDIT_LEVEL }}

      - name: Save audit report (JSON)
        if: always()
        run: npm audit --omit=dev --json > audit-report.json || true

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.service }}
          path: services/${{ matrix.service }}/audit-report.json

  trivy-image:
    name: Trivy Image Scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: npm-audit
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - delivery-service
          - notification-service
          - order-service
          - payment-service
          - restaurant-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          tags: ${{ matrix.service }}:ci
          push: false
          load: true

      - name: Trivy Image Scan (SARIF)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ matrix.service }}:ci
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'

      - name: Upload Trivy SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Fail on high/critical (optional)
        if: always()
        run: |
          CRIT=$(jq '[.runs[].results[] | select(.rule.severity=="critical")] | length' trivy-results.sarif)
          HIGH=$(jq '[.runs[].results[] | select(.rule.severity=="high")] | length' trivy-results.sarif)
          echo "critical=$CRIT, high=$HIGH"
          if [ "$CRIT" != "0" ] || [ "$HIGH" != "0" ]; then
            echo "High/Critical vulns found"; exit 1
          fi
